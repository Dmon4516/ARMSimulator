[licenses]
allow = [
  "MIT",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",   # any GPLv2-compatible at this level
]
confidence-threshold = 0.8

# Do NOT allow:
#   - Apache-2.0 (plain): incompatible with GPLv2 (see ADR-010 §4)
#   - GPL-3.0-only: incompatible with GPL-2.0-only
exceptions = [
  # Add per-crate exceptions here with a comment explaining why.
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"